<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mengalihkan ke Audit Salesman Arena…</title>

  <!-- Redirect ke Audit Salesman Arena (jeda 3 detik supaya kucingnya sempat terlihat) -->
  <meta http-equiv="refresh" content="3; url=https://nabatiarena.anindraa-dio.workers.dev/">
  <link rel="canonical" href="https://nabatiarena.anindraa-dio.workers.dev/">
  <meta name="robots" content="noindex">

  <style>
    :root { --merah:#a8231c; --merah-tua:#7a1511; --emas:#f2c14e; --krem:#fff4dc; }
    * { box-sizing:border-box; margin:0; }
    html, body { height:100%; }
    body {
      display:grid; place-items:center; padding:24px;
      background: radial-gradient(circle at 50% 40%, var(--merah) 0%, var(--merah-tua) 75%);
      color:var(--krem); font-family: Georgia, "Times New Roman", serif; text-align:center;
    }
    main { max-width:420px; }
    svg { width:min(220px, 60vw); height:auto; display:block; margin:0 auto 20px; }
    .tangan { transform-origin:150px 138px; animation:lambai 1.1s ease-in-out infinite alternate; }
    @keyframes lambai { from { transform:rotate(-8deg); } to { transform:rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { .tangan { animation:none; } }
    h1 { font-size:1.4rem; font-weight:normal; line-height:1.4; }
    p { margin-top:10px; font-size:1rem; line-height:1.6; opacity:.9; }
    a { color:var(--emas); }
    a:focus-visible { outline:2px solid var(--emas); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 200 240" role="img" aria-label="Kucing keberuntungan melambaikan tangan">
      <g stroke="#3a2a22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <!-- telinga -->
        <path d="M50 78 L56 28 L90 56 Z" fill="#fff"/>
        <path d="M150 78 L144 28 L110 56 Z" fill="#fff"/>
        <path d="M58 64 L61 42 L78 57 Z" fill="#f4a3a3" stroke="none"/>
        <path d="M142 64 L139 42 L122 57 Z" fill="#f4a3a3" stroke="none"/>
        <!-- badan -->
        <ellipse cx="100" cy="178" rx="62" ry="56" fill="#fff"/>
        <!-- kepala -->
        <ellipse cx="100" cy="96" rx="60" ry="50" fill="#fff"/>
        <!-- mata tersenyum -->
        <path d="M70 94 Q79 84 88 94" fill="none"/>
        <path d="M112 94 Q121 84 130 94" fill="none"/>
        <!-- pipi -->
        <ellipse cx="66" cy="110" rx="9" ry="5" fill="#f4a3a3" stroke="none" opacity=".7"/>
        <ellipse cx="134" cy="110" rx="9" ry="5" fill="#f4a3a3" stroke="none" opacity=".7"/>
        <!-- hidung & mulut -->
        <ellipse cx="100" cy="104" rx="4" ry="3" fill="#e0707a" stroke="none"/>
        <path d="M92 112 Q96 117 100 110 Q104 117 108 112" fill="none" stroke-width="2.5"/>
        <!-- kumis -->
        <path d="M40 100 L62 104 M40 112 L62 110 M160 100 L138 104 M160 112 L138 110" stroke-width="2"/>
        <!-- kalung & lonceng -->
        <path d="M56 138 Q100 158 144 138" fill="none" stroke="#c9302c" stroke-width="10"/>
        <circle cx="100" cy="155" r="10" fill="var(--emas, #f2c14e)"/>
        <path d="M92 155 L108 155" stroke-width="2"/>
        <!-- koin emas -->
        <ellipse cx="74" cy="190" rx="19" ry="26" fill="#f2c14e"/>
        <ellipse cx="74" cy="190" rx="12" ry="18" fill="none" stroke-width="2"/>
        <path d="M74 178 L74 202" stroke-width="2"/>
        <!-- kaki bawah memegang koin -->
        <ellipse cx="88" cy="208" rx="14" ry="10" fill="#fff"/>
        <!-- tangan melambai -->
        <g class="tangan">
          <rect x="138" y="72" width="26" height="70" rx="13" fill="#fff"/>
          <ellipse cx="151" cy="84" rx="6" ry="5" fill="#f4a3a3" stroke="none"/>
          <circle cx="143" cy="76" r="2.5" fill="#f4a3a3" stroke="none"/>
          <circle cx="151" cy="74" r="2.5" fill="#f4a3a3" stroke="none"/>
          <circle cx="159" cy="76" r="2.5" fill="#f4a3a3" stroke="none"/>
        </g>
      </g>
    </svg>

    <h1>Halaman ini sudah pindah ke Audit Salesman Arena</h1>
    <p>Mengalihkan dalam <span id="detik">3</span> detik…<br>
       Tidak jalan? <a href="https://nabatiarena.anindraa-dio.workers.dev/">Buka di sini</a>.</p>
  </main>

  <script>
    var sisa = 3, el = document.getElementById("detik");
    var t = setInterval(function () {
      sisa--; el.textContent = sisa;
      if (sisa <= 0) {
        clearInterval(t);
        // replace(): tombol Back tidak memantul kembali ke halaman ini
        window.location.replace("https://nabatiarena.anindraa-dio.workers.dev/");
      }
    }, 1000);
  </script>
</body>
</html>
